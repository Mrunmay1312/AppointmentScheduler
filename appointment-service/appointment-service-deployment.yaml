apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
  namespace: appointmentscheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appointment-service
  template:
    metadata:
      labels:
        app: appointment-service
    spec:
      containers:
      - name: appointment-service-container
        image: mrunmay1312/appointment-service-image:latest
        ports:
        - containerPort: 5003
---
apiVersion: v1
kind: Service
metadata:
  name: appointment-service
  namespace: appointmentscheduler
spec:
  type: NodePort
  selector:
    app: appointment-service
  ports:
    - protocol: TCP
      port: 5003           # Service port your app listens on
      targetPort: 5003      # Container port your app listens on
      nodePort: 30003       # NodePort to access outside the cluster

