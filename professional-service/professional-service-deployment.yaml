apiVersion: apps/v1
kind: Deployment
metadata:
  name: professional-service
  namespace: appointmentscheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: professional-service
  template:
    metadata:
      labels:
        app: professional-service
    spec:
      containers:
      - name: professional-service-container
        image: mrunmay1312/professional-service-image:v1
        ports:
        - containerPort: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: professional-service
  namespace: appointmentscheduler
spec:
  type: NodePort
  selector:
    app: professional-service
  ports:
    - protocol: TCP
      port: 5002           # Service port your app listens on
      targetPort: 5002      # Container port your app listens on
      nodePort: 30002      # NodePort to access outside the cluster

