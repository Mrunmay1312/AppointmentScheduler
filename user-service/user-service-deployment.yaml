apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: appointmentscheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service-container
        image: mrunmay1312/user-service-image:latest
        ports:
        - containerPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: appointmentscheduler
spec:
  type: NodePort
  selector:
    app: user-service
  ports:
    - protocol: TCP
      port: 5001           # Service port your app listens on
      targetPort: 5001      # Container port your app listens on
      nodePort: 30001       # NodePort to access outside the cluster
